name: LLM Compression
on: [push, workflow_dispatch]
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install LLMLingua
        run: pip install llmlingua
      - name: Compress Prompts
        run: python scripts/compress_all.py
